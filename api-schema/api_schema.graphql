"""
The `@oneOf` directive is used within the type system definition language to indicate that an Input Object is a OneOf Input Object.
"""
directive @oneOf on INPUT_OBJECT

"""
The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response.
"""
directive @cost(
  """
  The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc.
  """
  weight: String!
) on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | INPUT_FIELD_DEFINITION

"""A directive to indicate the relationship between two tables"""
directive @relationship(
  """The name of the GraphQL type the relationship targets"""
  target: String

  """The relationship cardinality"""
  cardinality: String
) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION

"""A directive to indicate the primary key field of an item."""
directive @primaryKey(
  """The underlying database type."""
  databaseType: String
) on FIELD_DEFINITION

"""A directive to indicate the enabled state of a node."""
directive @isEnabled(
  """The enabled state of the query or mutation."""
  enabledValue: Boolean
) on FIELD_DEFINITION

"""
A directive to indicate the type maps to a storable entity not a nested entity.
"""
directive @model(
  """Underlying name of the database entity."""
  name: String
) on OBJECT | FIELD_DEFINITION

"""A search result representing a matched schema element."""
type __SearchResult {
  """An opaque cursor for pagination."""
  cursor: String!

  """The schema coordinate of the matched element."""
  coordinate: String!

  """The matched schema definition."""
  definition: __SchemaDefinition!

  """
  Paths from this element to a root type, each as a list of schema coordinates.
  """
  pathsToRoot: [[String!]!]!

  """The relevance score of the match, or null if scoring is not supported."""
  score: Float
}

union __SchemaDefinition = __Type | __Field | __InputValue | __EnumValue | __Directive

enum OrderBy {
  ASC
  DESC
}

input DefaultValue {
  UnsignedByte: UnsignedByte
  Short: Short
  Int: Int
  Long: Long
  String: String
  Boolean: Boolean
  Single: Single
  Float: Float
  Decimal: Decimal
  DateTime: DateTime
  Base64String: Base64String
  LocalTime: LocalTime
}

