site_name: Humanitarian Action API
site_description: GraphQL queries and APIM client examples for the Humanitarian Action API
site_url: https://un-ocha.github.io/hpc-fabric-graphql-api-docs/
repo_url: https://github.com/UN-OCHA/hpc-fabric-graphql-api-docs
repo_name: UN-OCHA/hpc-fabric-graphql-api-docs
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Quick start: getting-started/quick-start.md
  - Client examples: clients.md
  - Writing queries: querying.md
  - Query catalogue:
      - Reference data: queries/reference-data.md
      - Plans: queries/plans.md
      - Projects and emergencies: queries/projects-and-emergencies.md
      - Sectors and coordination: queries/sectors-and-coordination.md
      - Requirements: queries/requirements.md
      - Organizations: queries/organizations.md
  - Reference:
      - Data rules: reference/data-model.md
      - API views and schema: reference/schema.md
      - Troubleshooting: reference/errors.md
      - Preview and publish: reference/publishing.md
